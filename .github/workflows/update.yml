name: Update CGC moisture tables

on:
  schedule:
    - cron: "0 12 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Scrape and parse
        run: python scripts/update_tables.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tables
          if git diff --cached --quiet; then
            echo "No table changes"
            exit 0
          fi
          git commit -m "Update moisture tables from CGC $(date -u +%Y-%m-%d)"
          git push
